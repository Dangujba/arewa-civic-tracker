name: Arewa Civic Tracker CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  application:
    name: Laravel feature tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, pdo_sqlite, sqlite3, fileinfo, gd, bcmath, intl
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test --no-ansi
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend and locally bundled icon assets
        run: npm run build
      - name: Verify JavaScript syntax
        run: |
          node --check public/js/act-sidebar.js
          node --check public/js/act-map.js
          node --check public/js/act-interactions.js
          node --check public/js/act-select-dialogs.js

  android-native:
    name: Native Android Kotlin unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Run native Android tests and compile
        working-directory: android-native
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload debug APK for QA
        uses: actions/upload-artifact@v4
        with:
          name: arewa-native-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
